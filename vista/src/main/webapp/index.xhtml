<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Usuario</title>
</h:head>
<h:body>

    <p:panelGrid class="txt">
        <f:facet name="header">
            <h:graphicImage name="sauap.png" alt="Logo SAUAP" style="width: 400px; height: auto;" />

            <p:row>
                <p:column colspan="7"><p:graphicImage url="resources/user.png" class="logo"/></p:column>
            </p:row>
        </f:facet>
        <p:row>
            <p:column styleClass="celda">Correo:</p:column>
            <p:column><h:outputText value="#{loginUI.usuario.correo}" /></p:column>
        </p:row>
        <p:row>
            <p:column styleClass="celda">ID Usuario:</p:column>
            <p:column><h:outputText value="#{loginUI.usuario.idUsuario}" /></p:column>
        </p:row>
        <f:facet name="footer">
            <p:row>
                <p:column colspan="7">
                    <h:link outcome="profesores" value="Ir a profesores"/>
                </p:column>
            </p:row>
        </f:facet>
    </p:panelGrid>
</h:body>
<style>
    .logo{
        width: 110px;
    }
    .celda{
        width: 30%;
        background-color: #C3BF8C !important;
        color: white;
        font-weight: 700;
    }
    .txt{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        height: fit-content;
        width: 420px;
        padding: 25px;
        margin: auto;
        background: #83AE85;
        border-radius: 10px;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
        font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    }
</style>
</html>
