<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet name="style.css" />
</h:head>

<h:body>
    <div class="login-page">

        <h:graphicImage name="sauap.png" alt="Logo SAUAP" style="width: 450px; height: auto;" />

        <div class="login-card">
            <h1>Iniciar Sesion</h1>

            <h:form>

                <p:messages id="messages" showDetail="true" closable="true" />

                <div class="campo">
                    <label>Usuario</label>
                    <p:inputText placeholder="Correo:" autocomplete="false"
                                 value="#{loginUI.usuario.correo}" />
                </div>

                <div class="campo">
                    <label>Contrasena</label>
                    <p:password placeholder="Contrasena:"
                                value="#{loginUI.usuario.contrasena}" />
                </div>

                <p:commandButton update="messages" class="btn-primario"
                                 value="Iniciar" actionListener="#{loginUI.login()}" />

            </h:form>
        </div>

    </div>
</h:body>
</html>
